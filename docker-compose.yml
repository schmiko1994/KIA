version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./tiktok_automation.db
      - DEBUG=true
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./tiktok_automation.db:/app/tiktok_automation.db
    restart: unless-stopped

